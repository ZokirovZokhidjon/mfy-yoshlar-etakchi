<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Галерея - Маҳалла Портали</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-blue: #1b2e4b; --accent: #ff5722; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; }
        .navbar { background: var(--main-blue); color: white; padding: 10px 50px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; }
        
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .section-title { border-left: 5px solid var(--accent); padding-left: 15px; margin-bottom: 30px; color: var(--main-blue); }

        /* Галерея сеткаси */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .gallery-item { position: relative; border-radius: 12px; overflow: hidden; height: 200px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s; }
        .gallery-item:hover { transform: scale(1.03); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: white; padding: 10px; font-size: 14px; opacity: 0; transition: 0.3s; }
        .gallery-item:hover .gallery-overlay { opacity: 1; }
    </style>
</head>
<body>

<nav class="navbar">
    <div style="font-weight:bold;">ЁШЛАР ЕТАКЧИСИ</div>
    <div class="nav-links">
        <a href="index.html">Асосий</a>
        <a href="gallery.html" style="color: var(--accent);">Галерея</a>
        <a href="news.html">Янгиликлар</a>
        <a href="login.html">Кабинет</a>
    </div>
</nav>

<div class="container">
    <h2 class="section-title">МАҲАЛЛА ГАЛЕРЕЯСИ</h2>
    <div class="gallery-grid">
        <div class="gallery-item"><img src="01.jpg"><div class="gallery-overlay">Тадбирдан лавҳа</div></div>
        <div class="gallery-item"><img src="960x540.jpg"><div class="gallery-overlay">Спорт мусобақаси</div></div>
        <div class="gallery-item"><img src="un10.jpg"><div class="gallery-overlay">Ёшлар учрашуви</div></div>
        </div>
</div>

</body>
</html>
