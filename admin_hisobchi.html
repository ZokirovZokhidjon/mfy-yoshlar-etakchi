<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ёшлар етакчиси кабинети | Blogger Style</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --blogger-orange: #ff5722; --google-blue: #4285f4; }
        body { font-family: 'Roboto', sans-serif; background-color: #f1f3f4; margin: 0; padding: 0; }
        
        /* Blogger Header */
        .navbar { background: white; padding: 10px 20px; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: bold; color: var(--blogger-orange); display: flex; align-items: center; gap: 10px; }
        
        .main-container { max-width: 1100px; margin: 20px auto; display: grid; grid-template-columns: 1fr 300px; gap: 20px; padding: 0 20px; }

        /* Left Side: Editor */
        .editor-card { background: white; padding: 25px; border-radius: 8px; border: 1px solid #ddd; }
        .post-input { width: 100%; border: none; border-bottom: 1px solid #eee; font-size: 24px; padding: 10px 0; outline: none; margin-bottom: 20px; }
        .post-input:focus { border-bottom: 2px solid var(--blogger-orange); }
        
        .toolbar { background: #f8f9fa; padding: 10px; border-radius: 4px; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; border: 1px solid #eee; }
        
        textarea { width: 100%; height: 400px; border: 1px solid #eee; padding: 15px; font-size: 16px; border-radius: 4px; resize: none; box-sizing: border-box; outline: none; }

        /* Buttons */
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 8px; font-size: 13px; transition: 0.2s; }
        .btn-publish { background: var(--google-blue); color: white; }
        .btn-word { background: #2b579a; color: white; }
        .btn-excel { background: #217346; color: white; }
        .btn-pdf { background: #d32f2f; color: white; }
        .btn:hover { filter: brightness(0.9); }

        /* Right Side: Info */
        .sidebar-card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
        .sidebar-card h3 { font-size: 14px; text-transform: uppercase; color: #5f6368; margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }

        /* Table */
        .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        .stats-table td { padding: 8px 0; border-bottom: 1px solid #f1f1f1; }
        
        .upload-label { display: block; width: 100%; background: #eee; text-align: center; padding: 10px; border-radius: 4px; cursor: pointer; border: 1px dashed #bbb; margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo"><i class="fab fa-blogger"></i> ЁШЛАР ЕТАКЧИСИ</div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <span style="font-size: 14px; color: #5f6368;"><i class="fas fa-user-circle"></i> Етакчи: <b>Shermirza</b></span>
        <button onclick="location.href='login.html'" class="btn" style="background: #f1f3f4; color: #333;"><i class="fas fa-sign-out-alt"></i> Чиқиш</button>
    </div>
</div>

<div class="main-container">
    <div class="editor-card">
        <input type="text" id="title" class="post-input" placeholder="Тадбир ёки ҳисобот сарлавҳаси...">
        
        <div class="toolbar">
            <button class="btn btn-publish" onclick="saveData()"><i class="fas fa-paper-plane"></i> ЮКЛАШ</button>
            <button class="btn btn-word" onclick="toWord()"><i class="fas fa-file-word"></i> Word</button>
            <button class="btn btn-excel" onclick="toExcel()"><i class="fas fa-file-excel"></i> Excel</button>
            <button class="btn btn-pdf" onclick="toPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
        </div>

        <textarea id="content" placeholder="Бу ерга тадбир тафсилотларини ёзинг..."></textarea>
    </div>

    <div class="sidebar-area">
        <div class="sidebar-card">
            <h3><i class="fas fa-cog"></i> Созламалар</h3>
            <p style="font-size: 12px; color: #666;">Ҳисобот типи:</p>
            <select id="type" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
                <option>Маънавий тадбир</option>
                <option>Спорт мусобақаси</option>
                <option>Беш ташаббус</option>
                <option>Хатин-қизлар бандлиги</option>
            </select>
            
            <label for="import" class="upload-label">
                <i class="fas fa-cloud-upload-alt"></i> Файлдан маълумот олиш
            </label>
            
            <input type="file" id="import" style="display:none" onchange="importFile(event)">
        </div>

        <div class="sidebar-card">
            <h3><i class="fas fa-history"></i> Сўнгги юкланганлар</h3>
            <table class="stats-table" id="historyTable">
                <tbody id="historyBody">
                    <tr><td style="color:#999; text-align:center;">Ҳозирча бўш</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 1. ТИЗИМГА ЮКЛАШ
    function saveData() {
        const title = document.getElementById('title').value;
        const text = document.getElementById('content').value;
        if(!title || !text) { alert("Сарлавҳа ва матнни тўлдиринг!"); return; }

        const date = new Date().toLocaleDateString();
        const tbody = document.getElementById('historyBody');
        
        if(tbody.innerText.includes("бўш")) tbody.innerHTML = "";

        const row = `<tr>
            <td><i class="fas fa-file-alt" style="color:#ff5722"></i> <b>${title}</b><br><small>${date}</small></td>
        </tr>`;
        tbody.innerHTML = row + tbody.innerHTML;
        alert("Ҳисобот етакчилар порталига юкланди!");
    }

    // 2. WORD ЭКСПОРТ
    function toWord() {
        const t = document.getElementById('title').value || "Hisobot";
        const c = document.getElementById('content').value;
        const blob = new Blob(['\ufeff', `САРЛАВҲА: ${t}\n\n${c}`], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = t + ".doc";
        a.click();
    }

    // 3. EXCEL ЭКСПОРТ
    function toExcel() {
        const t = document.getElementById('title').value || "Sarlavha";
        const c = document.getElementById('content').value || "Matn";
        const data = [[ "Sana", "Sarlavha", "Mazmuni" ], [ new Date().toLocaleDateString(), t, c ]];
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Hisobot");
        XLSX.writeFile(wb, t + ".xlsx");
    }

    // 4. PDF ЭКСПОРТ
    function toPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const t = document.getElementById('title').value || "Hisobot";
        const c = document.getElementById('content').value;
        doc.text(t, 10, 10);
        doc.text(c, 10, 20);
        doc.save(t + ".pdf");
    }

    // 5. EXCEL/FILE ИМПОРТ
    function importFile(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            // Оддий матн ёки Excel-ни ўқиш учун соддалаштирилган
            document.getElementById('content').value = "Файл юкланди: " + file.name + "\n\n(Маълумотлар қайта ишлаш учун тайёр)";
            alert("Файл муваффақиятли қабул қилинди!");
        };
        reader.readAsText(file);
    }
</script>

</body>
</html>
