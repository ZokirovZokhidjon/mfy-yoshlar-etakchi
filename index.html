<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Маҳалла Портали</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-blue: #1b2e4b; --accent: #ff5722; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; }
        
        /* Юқори Меню (Navbar) */
        .navbar { background: var(--main-blue); color: white; padding: 10px 50px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .logo { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px; line-height: 1.2; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; transition: 0.3s; padding: 8px 12px; border-radius: 5px; display: flex; align-items: center; gap: 8px; }
        .nav-links a:hover { background: var(--accent); }
        .login-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); }
        
        #clock { font-size: 18px; font-weight: bold; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; font-family: monospace; }

        /* Контент */
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .section-title { border-left: 5px solid var(--accent); padding-left: 15px; margin-bottom: 25px; color: var(--main-blue); text-transform: uppercase; letter-spacing: 1px; }

        /* Хабарлар Карточкаси (Асосий саҳифадаги кўриниш) */
        .post-card { background: white; border-radius: 12px; overflow: hidden; display: flex; margin-bottom: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .post-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .post-img { width: 300px; height: 220px; object-fit: cover; }
        .post-info { padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .post-info h2 { margin: 0 0 10px 0; font-size: 20px; color: var(--main-blue); }
        .post-info p { color: #666; font-size: 15px; line-height: 1.6; margin-bottom: 15px; }
        .read-more { align-self: flex-end; color: var(--accent); text-decoration: none; font-weight: bold; border: 1px solid var(--accent); padding: 6px 18px; border-radius: 5px; transition: 0.3s; font-size: 13px; }
        .read-more:hover { background: var(--accent); color: white; }

        /* Модал ойна (Батафсил ойнаси) */
        #modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 2000; overflow-y: auto; backdrop-filter: blur(5px); }
        
        .modal-content { background: white; max-width: 850px; margin: 40px auto; border-radius: 15px; padding: 0; position: relative; overflow: hidden; animation: slideIn 0.3s ease; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        
        @keyframes slideIn { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header-img { width: 100%; max-height: 450px; object-fit: cover; border-bottom: 4px solid var(--accent); }
        
        /* Скриншотдаги муаммони ҳал қилувчи қисм: */
        .modal-body-padding { padding: 40px 50px; line-height: 1.8; }
        .modal-body-padding h1 { color: var(--main-blue); font-size: 32px; margin-bottom: 20px; line-height: 1.3; }
        .modal-body-padding p { text-align: justify; word-wrap: break-word; color: #333; font-size: 18px; margin-bottom: 15px; }
        
        .close-modal { position: fixed; right: 30px; top: 20px; font-size: 45px; color: white; cursor: pointer; z-index: 2100; transition: 0.3s; }
        .close-modal:hover { color: var(--accent); transform: rotate(90deg); }

        /* Мобил қурилмалар учун мослашув */
        @media (max-width: 768px) {
            .post-card { flex-direction: column; }
            .post-img { width: 100%; height: 200px; }
            .modal-content { margin: 10px; width: calc(100% - 20px); }
            .modal-body-padding { padding: 20px; }
            .navbar { padding: 10px 20px; }
            .logo span { font-size: 14px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <i class="fas fa-landmark fa-2x"></i>
        <span>Ёшлар етакчисининг<br>веб портали</span>
    </div>
    
    <div class="nav-links">
        <a href="index.html"><i class="fas fa-home"></i> <span>Асосий</span></a>
        <a href="#"><i class="fas fa-images"></i> <span>Галерея</span></a>
        <a href="#"><i class="fas fa-newspaper"></i> <span>Янгиликлар</span></a>
        <a href="login.html" class="login-btn"><i class="fas fa-user-circle"></i> Кабинет</a>
    </div>

    <div id="clock">00:00:00</div>
</nav>

<div class="container">
    <h2 class="section-title">Сўнгги хабарлар</h2>
    <div id="news-feed">
        </div>
</div>

<div id="modal">
    <span class="close-modal" onclick="closePost()">&times;</span>
    <div class="modal-content" id="modal-content">
        <div id="modal-body"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
